# ─────────────────────────────────────────────────────────────
# Nginx Config for BGE Embedding API
# Domain: bge.artlabss.com (ya jo bhi tumhara domain ho)
# Proxy to: 192.168.8.17:8100
# ─────────────────────────────────────────────────────────────
# Place at: /etc/nginx/sites-available/bge-api
# Enable: ln -s /etc/nginx/sites-available/bge-api /etc/nginx/sites-enabled/
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name emb.quantumhash.me;

    # Certbot SSL ke liye redirect
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name emb.quantumhash.me;

    # SSL — Let's Encrypt (Certbot se milega)
    ssl_certificate /etc/letsencrypt/live/emb.quantumhash.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emb.quantumhash.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Timeouts — embedding large batches ke liye increase kiya
    proxy_connect_timeout       300;
    proxy_send_timeout          300;
    proxy_read_timeout          300;
    send_timeout                300;
    client_max_body_size        2G;  # 2GB tak ke requests allow karo

    # Proxy to FastAPI
    location / {
        proxy_pass         http://192.168.8.17:8100;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Swagger Docs allow karo (optional: restrict in production)
    location /docs {
        proxy_pass http://192.168.8.17:8100/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://192.168.8.17:8100/openapi.json;
        proxy_set_header Host $host;
    }
}